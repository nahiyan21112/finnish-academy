name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor & Generate Icons
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets
          npx cap init "Finnish Academy" "com.opensource.finnishacademy" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Finnish-Academy.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Finnish Academy (Latest APK)
          body: "Download `Finnish-Academy.apk` below to install directly on your Android device."
          files: Finnish-Academy.apk
          make_latest: true
