name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Patch Slider Flash in index.html
        run: |
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("www/index.html", "utf8");
            html = html.replace(/(<input[^>]*type=["\x27]range["\x27][^>]*?)oninput=/gi, "$1onchange=");
            fs.writeFileSync("www/index.html", html);
          '

      - name: Install Capacitor & Generate Icons
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets
          npx cap init "Finnish Academy" "com.opensource.finnishacademy" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

      - name: Enable Fullscreen Mode
        run: |
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n        <item name="android:statusBarColor">@android:color/transparent</item>\n        <item name="android:navigationBarColor">#0b0f19</item>|g' android/app/src/main/res/values/styles.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Finnish-Academy.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Finnish Academy (Latest APK)
          body: "Download `Finnish-Academy.apk` below to install directly on your Android device."
          files: Finnish-Academy.apk
          make_latest: true
