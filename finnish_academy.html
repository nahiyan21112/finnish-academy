<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="high">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Finnish Academy — Learn Proper Finnish</title>

  <!-- Google Fonts: M PLUS Rounded 1c (Anime UI) & Bangers (Manga Impact Callouts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
       1. ANIME THEME TOKENS (MIDNIGHT AURORA & SAKURA SNOW ACADEMY)
       ========================================================================== */
    :root,
    [data-theme="dark"] {
      --bg-outer: #070816;
      --bg-app: #0e1024;
      --bg-card: #171b38;
      --bg-card-alt: #1f254a;
      --bg-hud: rgba(14, 16, 36, 0.94);
      --text-main: #f4f7ff;
      --text-muted: #9aa7d6;
      --border-ink: #00e5ff;
      --border-subtle: #2e386b;
      --shadow-hard: #050611;
      --accent-primary: #00e5ff;
      --accent-primary-text: #091022;
      --accent-pink: #ff4d8d;
      --accent-gold: #ffd166;
      --accent-green: #2ee6a6;
      --halftone-dot: rgba(0, 229, 255, 0.075);
      --speedline-color: rgba(0, 229, 255, 0.085);
      --nav-active-bg: rgba(0, 229, 255, 0.18);
    }

    [data-theme="light"] {
      --bg-outer: #efe6dc;
      --bg-app: #fffaf5;
      --bg-card: #ffffff;
      --bg-card-alt: #f5f0ff;
      --bg-hud: rgba(255, 250, 245, 0.95);
      --text-main: #181a2f;
      --text-muted: #5a6082;
      --border-ink: #181a2f;
      --border-subtle: #181a2f;
      --shadow-hard: #181a2f;
      --accent-primary: #2979ff;
      --accent-primary-text: #ffffff;
      --accent-pink: #ff3d7f;
      --accent-gold: #ffb703;
      --accent-green: #00b87c;
      --halftone-dot: rgba(24, 26, 47, 0.055);
      --speedline-color: rgba(41, 121, 255, 0.08);
      --nav-active-bg: rgba(41, 121, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: 'M PLUS Rounded 1c', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-outer);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, a {
      touch-action: manipulation;
    }

    .font-impact {
      font-family: 'Bangers', 'M PLUS Rounded 1c', cursive, sans-serif;
      letter-spacing: 0.06em;
    }

    /* ==========================================================================
       2. 120Hz GPU-COMPOSITED CEL-SHADED COMPONENTS
       (Strictly animating transform & opacity only — zero layout/paint thrash)
       ========================================================================== */
    .anime-shell {
      background-color: var(--bg-app);
      background-image: radial-gradient(var(--halftone-dot) 1.3px, transparent 1.3px);
      background-size: 14px 14px;
      border-left: 2px solid var(--border-subtle);
      border-right: 2px solid var(--border-subtle);
    }

    .scroll-smooth-gpu {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .cel-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-subtle);
      box-shadow: 4px 4px 0px var(--shadow-hard);
      border-radius: 18px;
      contain: layout style paint;
    }

    .cel-card-accent {
      background-color: var(--bg-card);
      border: 2px solid var(--border-ink);
      box-shadow: 4px 4px 0px var(--shadow-hard);
      border-radius: 18px;
      contain: layout style paint;
    }

    .cel-btn {
      border: 2px solid var(--border-ink);
      box-shadow: 3px 3px 0px var(--shadow-hard);
      transform: translate3d(0, 0, 0);
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
      cursor: pointer;
      will-change: transform;
    }

    .cel-btn:active:not(:disabled) {
      transform: translate3d(2px, 2px, 0) scale(0.985);
    }

    .cel-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    /* Slanted Anime Tag */
    .anime-tag {
      display: inline-flex;
      align-items: center;
      transform: skewX(-10deg) translate3d(0, 0, 0);
      border: 2px solid var(--border-ink);
      box-shadow: 2px 2px 0px var(--shadow-hard);
    }
    .anime-tag > * {
      transform: skewX(10deg);
    }

    /* Diagonal Speed-Line Pattern */
    .speed-lines {
      background-image: repeating-linear-gradient(
        -25deg,
        transparent,
        transparent 10px,
        var(--speedline-color) 10px,
        var(--speedline-color) 14px
      );
    }

    /* Visual Novel Speech Box */
    .vn-box {
      background-color: var(--bg-card);
      border: 2px solid var(--border-ink);
      box-shadow: 4px 4px 0px var(--shadow-hard);
      border-radius: 18px;
      position: relative;
      contain: layout style paint;
    }

    /* 120Hz GPU-Composited RPG Gauge (uses transform: scaleX, never width!) */
    .rpg-gauge-track {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border-subtle);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      contain: layout style paint;
    }
    .rpg-gauge-fill {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-pink));
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      position: relative;
    }
    .rpg-gauge-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 55%);
    }

    /* Hide scrollbars cleanly */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Range Slider */
    input[type="range"].anime-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-card-alt);
      border: 2px solid var(--border-subtle);
      outline: none;
    }
    input[type="range"].anime-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gold);
      border: 2px solid #181a2f;
      cursor: pointer;
      transform: translate3d(0, 0, 0);
    }

    /* ==========================================================================
       3. GPU-ONLY KEYFRAME ANIMATIONS (120Hz / 144Hz SILKY SMOOTH)
       ========================================================================== */
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.46s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 { transform: rotateY(180deg) translate3d(0, 0, 0); }

    @keyframes fadeUpGPU {
      from { opacity: 0; transform: translate3d(0, 12px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .animate-fade-up {
      animation: fadeUpGPU 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes ainoIdleGPU {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -3.5px, 0); }
    }
    .aino-idle {
      animation: ainoIdleGPU 2.8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes floatUpXPGPU {
      0% { opacity: 0; transform: translate3d(-50%, 14px, 0) scale(0.75) rotate(-4deg); }
      20% { opacity: 1; transform: translate3d(-50%, -8px, 0) scale(1.12) rotate(2deg); }
      80% { opacity: 1; transform: translate3d(-50%, -38px, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(-50%, -60px, 0) scale(0.92); }
    }
    .xp-float {
      animation: floatUpXPGPU 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes mangaImpactGPU {
      0% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(0.35) rotate(-14deg); }
      22% { opacity: 1; transform: translate3d(-50%, -50%, 0) scale(1.16) rotate(-5deg); }
      38% { opacity: 1; transform: translate3d(-50%, -50%, 0) scale(1) rotate(-6deg); }
      82% { opacity: 1; transform: translate3d(-50%, -50%, 0) scale(1.03) rotate(-5deg); }
      100% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(1.26) rotate(-2deg); }
    }
    .impact-pop {
      animation: mangaImpactGPU 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes speakingPulseGPU {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
      50% { transform: translate3d(0, 0, 0) scale(1.09); opacity: 0.85; }
    }
    .is-speaking {
      animation: speakingPulseGPU 0.75s ease-in-out infinite !important;
      background-color: var(--accent-pink) !important;
      color: #ffffff !important;
      border-color: #ffffff !important;
    }

    /* Bottom Navigation Active Pill (GPU transform only) */
    .nav-icon-wrap {
      transform: translate3d(0, 0, 0);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
    }
    .nav-item.active .nav-icon-wrap {
      background-color: var(--nav-active-bg);
      border: 2px solid var(--border-ink);
      color: var(--accent-primary);
      transform: translate3d(0, -2px, 0) scale(1.04);
      box-shadow: 2px 2px 0px var(--shadow-hard);
    }
    .nav-item.active .nav-text {
      color: var(--accent-primary);
      font-weight: 800;
    }

    /* ==========================================================================
       4. REDUCED MOTION MODE
       ========================================================================== */
    [data-motion="reduced"] *,
    [data-motion="reduced"] *::before,
    [data-motion="reduced"] *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    [data-motion="reduced"] #ambient-canvas {
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <!-- Hardware-Accelerated Ambient Snow / Sakura Canvas (dt-normalized for 60/120/144Hz) -->
  <canvas id="ambient-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0" style="transform: translate3d(0,0,0);"></canvas>

  <!-- ========================================================================
       MOBILE-FIRST ANDROID-STYLE APP SHELL (max-w-[480px] on desktop)
       ======================================================================== -->
  <div id="app-shell" class="anime-shell relative z-10 w-full max-w-[480px] mx-auto min-h-screen flex flex-col shadow-2xl">

    <!-- 1. PERSISTENT TOP RPG HUD BAR -->
    <header class="sticky top-0 z-30 backdrop-blur-md border-b-2 px-3 pt-2.5 pb-2.5 space-y-2"
      style="background-color: var(--bg-hud); border-color: var(--border-subtle);">

      <!-- Top Row: Brand + Controls -->
      <div class="flex items-center justify-between gap-1.5">
        <!-- App Brand -->
        <div class="flex items-center gap-2 min-w-0">
          <div class="anime-tag px-2 py-0.5 shrink-0" style="background-color: var(--accent-primary); color: var(--accent-primary-text);">
            <span class="font-impact text-base leading-none tracking-wider">FINNISH</span>
          </div>
          <div class="leading-tight truncate">
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-black uppercase tracking-wider truncate" style="color: var(--text-main);">Academy</span>
              <span id="fps-badge" class="hidden px-1.5 py-0.2 rounded text-[9px] font-black tabular-nums border"
                style="background-color: var(--bg-card-alt); border-color: var(--accent-green); color: var(--accent-green);">120 FPS</span>
            </div>
            <div class="text-[10px] font-bold truncate" style="color: var(--text-muted);" id="hud-rank-label">Beginner</div>
          </div>
        </div>

        <!-- Right HUD Controls: Spoken/Standard Toggle, Sound Toggle, Streak -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Global Register Toggle (English labels) -->
          <button id="btn-spoken-toggle" onclick="toggleSpokenMode()" title="Switch between Standard Finnish and Spoken Finnish"
            class="cel-btn flex items-center gap-1 px-2 py-1 rounded-xl text-[10px] font-extrabold">
            <span id="spoken-dot" class="w-2 h-2 rounded-full shrink-0"></span>
            <span id="spoken-label">Spoken</span>
          </button>

          <!-- Sound Effects Toggle -->
          <button id="btn-sfx-toggle" onclick="toggleSfx()" title="Toggle Sound Effects"
            class="cel-btn w-8 h-7 rounded-xl flex items-center justify-center text-xs font-bold"
            style="background-color: var(--bg-card-alt); color: var(--text-main);">
            <span id="sfx-icon">🔊</span>
          </button>

          <!-- Daily Streak Counter -->
          <button onclick="switchTab('profile')" title="Daily Streak"
            class="cel-btn flex items-center gap-1 px-2 py-1 rounded-xl text-[11px] font-black"
            style="background-color: var(--accent-gold); color: #181a2f;">
            <span>🔥</span>
            <span id="hud-streak">1</span>
          </button>
        </div>
      </div>

      <!-- Bottom Row: RPG Level & EXP Progress Bar (GPU scaleX) -->
      <div class="flex items-center gap-2">
        <div class="anime-tag px-2 py-0.5 shrink-0" style="background-color: var(--accent-pink); color: #ffffff;">
          <span class="text-[10px] font-black tracking-wide" id="hud-level">LV. 1</span>
        </div>
        <div class="rpg-gauge-track flex-1 h-3">
          <div id="hud-xp-bar" class="rpg-gauge-fill" style="transform: scaleX(0.05);"></div>
        </div>
        <span class="text-[10px] font-extrabold shrink-0 tabular-nums" style="color: var(--accent-gold);" id="hud-xp-text">0 / 100 XP</span>
      </div>
    </header>

    <!-- 2. MAIN SCROLLABLE VIEWPORT -->
    <main id="main-content" class="flex-1 overflow-y-auto scroll-smooth-gpu px-3.5 pt-3.5 pb-28">
      <!-- Active Tab Renders Here -->
    </main>

    <!-- 3. FIXED 5-TAB ANDROID BOTTOM NAVIGATION BAR -->
    <nav aria-label="Main Navigation"
      class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 border-t-2 px-1.5 pt-2 pb-2.5 grid grid-cols-5 gap-1 backdrop-blur-md"
      style="background-color: var(--bg-hud); border-color: var(--border-subtle);">

      <button class="nav-item flex flex-col items-center gap-1" data-tab="learn" onclick="switchTab('learn')">
        <div class="nav-icon-wrap w-12 h-7 rounded-xl flex items-center justify-center" style="color: var(--text-muted);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="nav-text text-[10px] font-bold" style="color: var(--text-muted);">Learn</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1" data-tab="practice" onclick="switchTab('practice')">
        <div class="nav-icon-wrap w-12 h-7 rounded-xl flex items-center justify-center" style="color: var(--text-muted);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="16" height="14" rx="3"/><path d="M6 2h12a3 3 0 0 1 3 3v11"/></svg>
        </div>
        <span class="nav-text text-[10px] font-bold" style="color: var(--text-muted);">Practice</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1" data-tab="cases" onclick="switchTab('cases')">
        <div class="nav-icon-wrap w-12 h-7 rounded-xl flex items-center justify-center" style="color: var(--text-muted);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <span class="nav-text text-[10px] font-bold" style="color: var(--text-muted);">Cases</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1" data-tab="tutor" onclick="switchTab('tutor')">
        <div class="nav-icon-wrap w-12 h-7 rounded-xl flex items-center justify-center" style="color: var(--text-muted);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
        </div>
        <span class="nav-text text-[10px] font-bold" style="color: var(--text-muted);">AI Tutor</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1" data-tab="profile" onclick="switchTab('profile')">
        <div class="nav-icon-wrap w-12 h-7 rounded-xl flex items-center justify-center" style="color: var(--text-muted);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="nav-text text-[10px] font-bold" style="color: var(--text-muted);">Profile</span>
      </button>
    </nav>
  </div>

  <!-- ========================================================================
       MODAL / LESSON SHEET OVERLAY
       ======================================================================== -->
  <div id="modal-overlay" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-3">
    <div id="modal-sheet" class="w-full max-w-[480px] max-h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden animate-fade-up"
      style="background-color: var(--bg-app); border: 2px solid var(--border-ink); box-shadow: 0 -6px 30px rgba(0,0,0,0.5);">
    </div>
  </div>

  <!-- FLOATING RPG FX & TOAST LAYERS -->
  <div id="fx-layer" class="fixed inset-0 pointer-events-none z-[70] overflow-hidden"></div>
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[65] w-[90%] max-w-[440px] flex flex-col items-center gap-1.5 pointer-events-none"></div>

  <!-- ========================================================================
       APPLICATION LOGIC
       ======================================================================== -->
  <script>
    /* ========================================================================
       1. INTERACTIVE SVG ANIME GUIDE: AINO (4 EXPRESSIONS + GPU IDLE BOB)
       ======================================================================== */
    function ainoSVG(mood = 'happy', size = 76) {
      let eyes = '';
      let mouth = '';
      let extra = '';

      if (mood === 'cheering') {
        eyes = `
          <path d="M35 47 Q40 41 45 47" stroke="#181a2f" stroke-width="2.8" fill="none" stroke-linecap="round"/>
          <path d="M55 47 Q60 41 65 47" stroke="#181a2f" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        `;
        mouth = `<path d="M44 56 Q50 64 56 56 Z" fill="#ff5d8f" stroke="#181a2f" stroke-width="1.8" stroke-linejoin="round"/>`;
        extra = `
          <path d="M16 20 L19 13 L22 20 L29 23 L22 26 L19 33 L16 26 L9 23 Z" fill="#ffd166" stroke="#181a2f" stroke-width="1.4"/>
          <path d="M82 14 L84 9 L86 14 L91 16 L86 18 L84 23 L82 18 L77 16 Z" fill="#00e5ff" stroke="#181a2f" stroke-width="1.2"/>
        `;
      } else if (mood === 'thinking') {
        eyes = `
          <ellipse cx="40" cy="46" rx="4.2" ry="4.8" fill="#181a2f"/>
          <circle cx="41.5" cy="44.2" r="1.6" fill="#ffffff"/>
          <circle cx="38.8" cy="47.8" r="1" fill="#00e5ff"/>
          <ellipse cx="60" cy="46" rx="4.2" ry="4.8" fill="#181a2f"/>
          <circle cx="61.5" cy="44.2" r="1.6" fill="#ffffff"/>
          <circle cx="58.8" cy="47.8" r="1" fill="#00e5ff"/>
        `;
        mouth = `<path d="M46 58 Q50 56 54 58" stroke="#181a2f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
        extra = `
          <circle cx="82" cy="24" r="3" fill="#00e5ff" stroke="#181a2f" stroke-width="1.3"/>
          <circle cx="88" cy="16" r="4.5" fill="#ffffff" stroke="#181a2f" stroke-width="1.3"/>
          <text x="85.5" y="19" font-size="7" font-weight="900" fill="#181a2f">?</text>
        `;
      } else if (mood === 'surprised') {
        eyes = `
          <ellipse cx="40" cy="46" rx="4.8" ry="5.6" fill="#181a2f"/>
          <circle cx="41.5" cy="44" r="2" fill="#ffffff"/>
          <circle cx="38.5" cy="48.5" r="1.2" fill="#00e5ff"/>
          <ellipse cx="60" cy="46" rx="4.8" ry="5.6" fill="#181a2f"/>
          <circle cx="61.5" cy="44" r="2" fill="#ffffff"/>
          <circle cx="58.5" cy="48.5" r="1.2" fill="#00e5ff"/>
        `;
        mouth = `<ellipse cx="50" cy="58.5" rx="3.4" ry="4" fill="#ff5d8f" stroke="#181a2f" stroke-width="1.8"/>`;
        extra = `
          <path d="M83 11 L87 11 L86 22 L84 22 Z" fill="#ff4d8d" stroke="#181a2f" stroke-width="1.2"/>
          <circle cx="85" cy="26" r="2" fill="#ff4d8d" stroke="#181a2f" stroke-width="1.2"/>
        `;

    /* ========================================================================
       2. WEB AUDIO API — SYNTHESIZED RPG SOUND EFFECTS
       ======================================================================== */
    const sfx = {
      ctx: null,
      ensure() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },
      tone(freq, dur, type = 'sine', vol = 0.1, delay = 0) {
        if (!appState.sfxEnabled) return;
        const ctx = this.ensure();
        if (!ctx) return;
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      },
      play(kind) {
        if (!appState.sfxEnabled) return;
        if (kind === 'click') {
          this.tone(660, 0.055, 'triangle', 0.07);
        } else if (kind === 'flip') {
          this.tone(520, 0.065, 'sine', 0.07);
          this.tone(740, 0.075, 'sine', 0.06, 0.04);
        } else if (kind === 'correct') {
          this.tone(587.33, 0.11, 'triangle', 0.11, 0);
          this.tone(880.00, 0.17, 'triangle', 0.11, 0.085);
        } else if (kind === 'combo') {
          this.tone(659.25, 0.095, 'triangle', 0.11, 0);
          this.tone(880.00, 0.095, 'triangle', 0.11, 0.065);
          this.tone(1174.66, 0.17, 'sine', 0.12, 0.13);
        } else if (kind === 'wrong') {
          this.tone(240, 0.15, 'sawtooth', 0.07, 0);
          this.tone(185, 0.21, 'sawtooth', 0.07, 0.095);
        } else if (kind === 'levelup') {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
            this.tone(f, 0.21, 'triangle', 0.12, i * 0.07);
          });
        } else if (kind === 'export') {
          this.tone(659.25, 0.1, 'sine', 0.1, 0);
          this.tone(880.00, 0.12, 'sine', 0.1, 0.07);
          this.tone(1046.50, 0.18, 'triangle', 0.11, 0.14);
        }
      }
    };

    /* ========================================================================
       4. 120Hz / 144Hz DELTA-TIME AMBIENT CANVAS & LIVE FPS MONITOR
       ======================================================================== */
    const engine120Hz = {
      rafId: null,
      lastTime: 0,
      fpsAccumulator: 0,
      fpsFrames: 0,
      currentFps: 60,
      particles: [],
      canvas: null,
      ctx: null,
      w: 0,
      h: 0,

      init() {
        this.canvas = document.getElementById('ambient-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d', { alpha: true });

        this.particles = Array.from({ length: 30 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: 2.5 + Math.random() * 4.2,
          // Velocity in pixels per second (identical visual speed at 60Hz, 120Hz, 144Hz!)
          vy: 22 + Math.random() * 36,
          vx: (Math.random() - 0.5) * 18,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 1.4,
          phase: Math.random() * Math.PI * 2
        }));

        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.w = window.innerWidth;
          this.h = window.innerHeight;
          this.canvas.width = Math.floor(this.w * dpr);
          this.canvas.height = Math.floor(this.h * dpr);
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        window.addEventListener('resize', resize, { passive: true });
        resize();

        this.lastTime = performance.now();
        this.rafId = requestAnimationFrame((t) => this.loop(t));
      },

      loop(now) {
        this.rafId = requestAnimationFrame((t) => this.loop(t));

        // Clamp delta-time to 50ms so tab switches never cause particle jumps
        const rawDt = (now - this.lastTime) / 1000;
        const dt = Math.min(Math.max(rawDt, 0.001), 0.05);
        this.lastTime = now;

        // Live FPS measurement (updates DOM twice per second when badge is active)
        this.fpsFrames++;
        this.fpsAccumulator += rawDt;
        if (this.fpsAccumulator >= 0.45) {
          this.currentFps = Math.round(this.fpsFrames / this.fpsAccumulator);
          this.fpsFrames = 0;
          this.fpsAccumulator = 0;
          if (appState && appState.showFps) {
            const badge = document.getElementById('fps-badge');
            if (badge) badge.textContent = `${this.currentFps} FPS`;
          }
        }

        // Skip canvas drawing when Reduced Motion is active
        if (appState && appState.reducedMotion) return;

        const ctx = this.ctx;
        const w = this.w;
        const h = this.h;
        ctx.clearRect(0, 0, w, h);

        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        ctx.fillStyle = isLight ? 'rgba(255, 61, 127, 0.26)' : 'rgba(0, 229, 255, 0.22)';

        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          p.phase += 1.1 * dt;
          p.y += p.vy * dt;
          p.x += (p.vx + Math.sin(p.phase) * 16) * dt;
          p.rot += p.vrot * dt;

          if (p.y > h + 14) { p.y = -14; p.x = Math.random() * w; }
          if (p.x > w + 14) p.x = -14;
          if (p.x < -14) p.x = w + 14;

          ctx.save();
          ctx.translate(p.x, p.y);
          if (isLight) {
            ctx.rotate(p.rot);
            ctx.beginPath();
            ctx.ellipse(0, 0, p.r * 1.1, p.r * 0.58, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.r * 0.65, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }
    };

       6. PERSISTENT STATE (localStorage)

    const STORAGE_KEY = 'finnish_academy_120hz_v3';

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getDefaultState() {
      return {
        theme: 'dark',           // 'dark' (Midnight Aurora) | 'light' (Sakura Snow Academy)
        showSpoken: true,        // true = Spoken Finnish shown alongside Standard Finnish
        sfxEnabled: true,
        reducedMotion: false,    // false = High Refresh Rate (120Hz) Animations
        showFps: false,          // Live FPS / Refresh Rate monitor badge
        xp: 0,
        dailyXp: 0,
        dailyGoal: 100,
        streak: 1,
        lastActiveDate: getTodayStr(),
        lastBackupAt: null,
        completedLessons: [],
        badges: [],
        srs: {},
        customCards: [],
        casesExplored: [],
        bestBlitz: 0
      };
    }

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = Object.assign(getDefaultState(), JSON.parse(raw));
        const today = getTodayStr();
        if (parsed.lastActiveDate !== today) {
          const diff = Math.round((new Date(today) - new Date(parsed.lastActiveDate)) / 86400000);
          parsed.streak = diff === 1 ? (parsed.streak || 1) + 1 : 1;
          parsed.dailyXp = 0;
          parsed.lastActiveDate = today;
        }
        return parsed;
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
      syncHUD();
    }

    function getLevelInfo(xp) {
      const level = Math.floor(xp / 100) + 1;
      const inLevel = xp % 100;
      return { level, inLevel, needed: 100, ratio: Math.max(0.03, inLevel / 100) };
    }

    function getAcademyRank(xp) {
      if (xp >= 1200) return { title: 'Finnish Master', next: null, nextXp: 1200 };
      if (xp >= 700)  return { title: 'Scholar',        next: 'Finnish Master', nextXp: 1200 };
      if (xp >= 350)  return { title: 'Speaker',        next: 'Scholar',        nextXp: 700 };
      if (xp >= 120)  return { title: 'Explorer',       next: 'Speaker',        nextXp: 350 };
      return { title: 'Beginner', next: 'Explorer', nextXp: 120 };
    }

    function awardXP(amount, showFloat = true) {
      if (!amount || amount <= 0) return;
      const prevLevel = getLevelInfo(appState.xp).level;
      appState.xp += amount;
      appState.dailyXp += amount;
      appState.lastActiveDate = getTodayStr();
      const newLevel = getLevelInfo(appState.xp).level;

      if (showFloat) spawnFloatingXP(`+${amount} XP!`);
      if (newLevel > prevLevel) {
        sfx.play('levelup');
        spawnImpactCallout(`LEVEL UP! LV.${newLevel}`, '#ffd166');
      }
      if (appState.xp >= 200) unlockBadge('dedicated_learner');
      saveState();
    }

    function unlockBadge(id) {
      if (appState.badges.includes(id)) return;
      appState.badges.push(id);
      saveState();
      const b = BADGES.find(x => x.id === id);
      if (b) showToast(`BADGE UNLOCKED: ${b.icon} ${b.name}!`, 'badge');
    }

    function getAllCards() {
      return [...appState.customCards, ...BASE_FLASHCARDS];
    }

    function getMasteredCount() {
      return Object.values(appState.srs).filter(s => s.level >= 2).length;
    }

    /* ========================================================================
       7. FINNISH WEB SPEECH API AUDIO ENGINE (1.0x & 0.7x)
       ======================================================================== */
    let voicesCache = [];
    let warnedNoFi = false;
    let activeSpeakBtn = null;

    function refreshVoices() {
      if ('speechSynthesis' in window) voicesCache = window.speechSynthesis.getVoices() || [];
    }
    if ('speechSynthesis' in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function clearSpeakingIndicator() {
      if (activeSpeakBtn) {
        activeSpeakBtn.classList.remove('is-speaking');
        activeSpeakBtn = null;
      }
    }

    function speakFinnish(text, rate = 1.0, btnEl = null) {
      if (!text) return;
      const clean = String(text).replace(/[*_~`]/g, '').trim();
      clearSpeakingIndicator();

      if (!('speechSynthesis' in window)) {
        showToast(`Pronunciation: "${clean}"`, 'info');
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'fi-FI';
        utter.rate = rate;

        if (!voicesCache.length) refreshVoices();
        const fiVoice = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith('fi'));
        if (fiVoice) {
          utter.voice = fiVoice;
        } else if (!warnedNoFi) {
          warnedNoFi = true;
          showToast('No native Finnish voice installed — using default device speech.', 'info');
        }

        if (btnEl) {
          activeSpeakBtn = btnEl;
          btnEl.classList.add('is-speaking');
        }
        utter.onend = clearSpeakingIndicator;
        utter.onerror = clearSpeakingIndicator;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        clearSpeakingIndicator();
        showToast(`Audio: "${clean}"`, 'info');
      }
    }

       8. HELPERS: ESCAPING, THEME, MOTION, HUD SYNC, MODAL
       ======================================================================== */
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function applyPreferences() {
      document.documentElement.setAttribute('data-theme', appState.theme === 'light' ? 'light' : 'dark');

    }

    function setTheme(themeName) {

      document.getElementById('hud-xp-text').textContent = `${lv.inLevel} / ${lv.needed} XP`;
      document.getElementById('hud-streak').textContent = appState.streak;
      document.getElementById('hud-rank-label').textContent = rank.title;
      document.getElementById('sfx-icon').textContent = appState.sfxEnabled ? '🔊' : '🔇';

      const sBtn = document.getElementById('btn-spoken-toggle');

      const sLbl = document.getElementById('spoken-label');
      if (appState.showSpoken) {

                  return `<button onclick="toggleLessonTile(${t.id})" ${used || L.answered ? 'disabled' : ''}
                    class="cel-btn px-3 py-2 rounded-xl text-xs font-black"
                    style="background-color: var(--bg-card); color: var(--text-main);">${t.word}</button>`;
                }).join('')}
              </div>

              ${L.answered ? `
                <div class="vn-box p-3 flex items-center gap-2.5 animate-fade-up"
                  style="border-color: ${L.lastCorrect ? 'var(--accent-green)' : 'var(--accent-pink)'};">
                  ${ainoSVG(ainoMood, 52)}
                  <div class="flex-1 min-w-0 text-xs">
                    <div class="font-black" style="color: ${L.lastCorrect ? 'var(--accent-green)' : 'var(--accent-pink)'};">
                      ${L.lastCorrect ? 'PERFECT! Great sentence!' : 'Almost! Correct Standard Finnish:'}
                    </div>
                    <div class="font-bold mt-0.5">${targetSentence}</div>
                  </div>
                  ${audioButtonsHTML(targetSentence, true)}
                </div>
              ` : `
                <button onclick="checkTileSentence()" ${L.selectedTiles.length === 0 ? 'disabled' : ''}
                  class="cel-btn w-full py-3 rounded-2xl font-black text-sm"
                  style="background-color: var(--accent-gold); color: #181a2f;">
                  CHECK SENTENCE
                </button>
              `}
            </div>
          `;
        } else {
          const promptBlock = L.id === 'm2'
            ? `<div class="text-[10px] font-black uppercase" style="color: var(--accent-pink);">Vowel Harmony Matcher</div>
               <div class="flex items-center justify-between mt-1">
                 <div><span class="text-2xl font-black">${q.word}</span> <span class="text-xs font-bold" style="color:var(--text-muted)">(${q.en})</span></div>
                 ${audioButtonsHTML(q.word, true)}
               </div>`
            : L.id === 'm3'
              ? `<div class="text-[10px] font-black uppercase" style="color: var(--accent-pink);">Choose the Correct Case</div>
                 <div class="text-base font-black mt-1">${q.sentence}</div>`
              : `<div class="text-xs font-bold" style="color: var(--text-muted);">${q.prompt}</div>
                 ${q.word ? `<div class="mt-2 flex items-center justify-between"><span class="text-2xl font-black">${q.word}</span>${audioButtonsHTML(q.word, false)}</div>` : ''}`;

          drillHTML = `
            <div class="space-y-3.5">
              <div class="cel-card p-3.5">${promptBlock}</div>
              <div class="grid ${q.options.length === 2 ? 'grid-cols-2' : 'grid-cols-1'} gap-2.5">
                ${q.options.map((opt, idx) => {
                  let bg = 'var(--bg-card)';
                  let border = 'var(--border-subtle)';
                  let col = 'var(--text-main)';
                  if (L.answered) {
                    if (idx === q.correct) { bg = 'var(--accent-green)'; border = '#181a2f'; col = '#181a2f'; }
                    else if (idx === L.chosenIdx) { bg = 'var(--accent-pink)'; border = '#181a2f'; col = '#ffffff'; }
                  }
                  return `
                    <button onclick="answerLessonMC(${idx})" ${L.answered ? 'disabled' : ''}
                      class="cel-btn p-3 rounded-2xl text-left text-sm font-black"
                      style="background-color: ${bg}; border-color: ${border}; color: ${col};">
                      ${opt}
                    </button>
                  `;
                }).join('')}
              </div>

              ${L.answered ? `
                <div class="vn-box p-3 flex items-center gap-2.5 animate-fade-up"
                  style="border-color: ${L.lastCorrect ? 'var(--accent-green)' : 'var(--accent-pink)'};">
                  ${ainoSVG(ainoMood, 52)}
                  <div class="text-xs leading-snug">
                    <div class="font-black" style="color: ${L.lastCorrect ? 'var(--accent-green)' : 'var(--accent-pink)'};">
                      ${L.lastCorrect ? 'CORRECT! Nice job!' : 'Not quite! Here is why:'}
                    </div>
                    <div class="font-medium mt-0.5">${q.explain}</div>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        openModal(`
          ${header}
          <div class="px-4 pt-3 shrink-0">
            <div class="flex justify-between text-[11px] font-black mb-1">
              <span style="color: var(--text-muted);">QUESTION ${L.qIdx + 1} / ${items.length}</span>
              <span style="color: var(--accent-gold);">SCORE: ${L.score}</span>
            </div>
            <div class="rpg-gauge-track h-2.5"><div class="rpg-gauge-fill" style="transform: scaleX(${ratio});"></div></div>
          </div>
          <div class="p-4 overflow-y-auto scroll-smooth-gpu flex-1">${drillHTML}</div>
          ${L.answered ? `
            <div class="p-3.5 border-t-2 shrink-0" style="border-color: var(--border-subtle);">
              <button onclick="nextLessonQuestion()" class="cel-btn w-full py-3 rounded-2xl font-impact text-xl tracking-wider"
                style="background-color: var(--accent-primary); color: var(--accent-primary-text);">
                ${L.qIdx + 1 < items.length ? 'NEXT QUESTION →' : 'FINISH LESSON 🎉'}
              </button>
            </div>
          ` : ''}
        `);
        return;
      }

      // STEP 2: Lesson Complete Summary
      if (L.step === 2) {
        const total = MODULE_DRILLS[L.id].length;
        const acc = Math.round((L.score / total) * 100);
        openModal(`
          <div class="p-6 text-center space-y-4 speed-lines">
            <div class="flex justify-center">${ainoSVG('cheering', 100)}</div>
            <div>
              <div class="font-impact text-4xl tracking-wider" style="color: var(--accent-gold); text-shadow: 3px 3px 0 #181a2f;">LESSON COMPLETE!</div>
              <p class="text-xs font-bold mt-1" style="color: var(--text-muted);">Awesome work finishing <strong>${L.mod.title}</strong>!</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="cel-card p-3" style="border-color: var(--accent-gold);">
                <div class="font-impact text-2xl" style="color: var(--accent-gold);">+${L.awardedXp} XP</div>
                <div class="text-[10px] font-black uppercase" style="color: var(--text-muted);">Earned</div>
              </div>
              <div class="cel-card p-3" style="border-color: var(--accent-primary);">
                <div class="font-impact text-2xl" style="color: var(--accent-primary);">${acc}%</div>
                <div class="text-[10px] font-black uppercase" style="color: var(--text-muted);">Accuracy (${L.score}/${total})</div>
              </div>
            </div>
            <button onclick="closeModal(); renderCurrentTab();" class="cel-btn w-full py-3 rounded-2xl font-impact text-xl tracking-wider"
              style="background-color: var(--accent-primary); color: var(--accent-primary-text);">
              BACK TO LEARNING PATH
            </button>
          </div>
        `);
      }
    }

    function startLessonDrill() {
      sfx.play('click');
      activeLesson.step = 1;
      activeLesson.qIdx = 0;
      activeLesson.score = 0;
      activeLesson.answered = false;
      activeLesson.tilePool = null;
      renderActiveLesson();
    }

    function answerLessonMC(idx) {
      const L = activeLesson;
      if (L.answered) return;
      const q = MODULE_DRILLS[L.id][L.qIdx];
      L.answered = true;
      L.chosenIdx = idx;
      L.lastCorrect = (idx === q.correct);
      if (L.lastCorrect) {
        L.score++;
        sfx.play('correct');
      } else {
        sfx.play('wrong');
      }
      renderActiveLesson();
    }

    function toggleLessonTile(id) {
      const L = activeLesson;
      if (L.answered) return;
      sfx.play('click');
      const pos = L.selectedTiles.indexOf(id);
      if (pos >= 0) L.selectedTiles.splice(pos, 1);
      else L.selectedTiles.push(id);
      renderActiveLesson();
    }

    function checkTileSentence() {
      const L = activeLesson;
      const q = MODULE_DRILLS[L.id][L.qIdx];
      const built = L.selectedTiles.map(id => L.tilePool.find(t => t.id === id).word).join(' ');
      L.answered = true;
      L.lastCorrect = (built === q.target.join(' '));
      if (L.lastCorrect) {
        L.score++;
        sfx.play('combo');
        spawnImpactCallout('PERFECT!', '#2ee6a6');
      } else {
        sfx.play('wrong');
      }
      renderActiveLesson();
    }

    function nextLessonQuestion() {
      sfx.play('click');
      const L = activeLesson;
      const items = MODULE_DRILLS[L.id];
      if (L.qIdx + 1 < items.length) {
        L.qIdx++;
        L.answered = false;
        L.tilePool = null;
        renderActiveLesson();
      } else {
        const alreadyDone = appState.completedLessons.includes(L.id);
        if (!alreadyDone) appState.completedLessons.push(L.id);
        L.awardedXp = alreadyDone ? Math.round(L.mod.xp * 0.4) : L.mod.xp;
        awardXP(L.awardedXp);
        unlockBadge('first_lesson');
        if (L.id === 'm2') unlockBadge('harmony_master');
        sfx.play('combo');
        spawnImpactCallout('GREAT!', '#00e5ff');
        L.step = 2;
        renderActiveLesson();
      }
    }

    /* ========================================================================
       11. TAB 2: PRACTICE (SRS FLASHCARDS & QUICK BLITZ QUIZ)
       ======================================================================== */
    const practiceState = {
      subMode: 'srs', // 'srs' | 'blitz'
      category: 'All',
      flipped: false,
      currentCardId: null
    };

    const blitzState = {
      active: false,
      finished: false,
      questions: [],
      qIdx: 0,
      score: 0,
      combo: 0,
      maxCombo: 0,
      timeLeft: 12,
      timerId: null,
      answered: false,
      chosenIdx: -1
    };

    function getFilteredCards() {
      const all = getAllCards();
      return practiceState.category === 'All' ? all : all.filter(c => c.cat === practiceState.category);
    }

    function pickNextSRSCard() {
      const pool = getFilteredCards();
      if (!pool.length) return null;
      const now = Date.now();
      const sorted = [...pool].sort((a, b) => {
        const sa = appState.srs[a.id] || { level: 0, nextDue: 0 };
        const sb = appState.srs[b.id] || { level: 0, nextDue: 0 };
        const aDue = sa.nextDue <= now ? 0 : 1;
        const bDue = sb.nextDue <= now ? 0 : 1;
        if (aDue !== bDue) return aDue - bDue;
        if (sa.nextDue !== sb.nextDue) return sa.nextDue - sb.nextDue;
        return sa.level - sb.level;
      });
      if (sorted.length > 1 && sorted[0].id === practiceState.currentCardId) return sorted[1];
      return sorted[0];
    }

    function renderPracticeTab(container) {
      const categories = ['All', 'Essentials', 'Café & Food', 'Campus & Daily', 'Verbs', 'Numbers & Time'];
      if (appState.customCards.length > 0) categories.push('My Saved');

      const switcher = `
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setPracticeMode('srs')" class="cel-btn py-2.5 rounded-2xl text-xs font-black"
            style="background-color: ${practiceState.subMode === 'srs' ? 'var(--accent-primary)' : 'var(--bg-card)'};
                   color: ${practiceState.subMode === 'srs' ? 'var(--accent-primary-text)' : 'var(--text-muted)'};">
            🗂️ FLASHCARDS
          </button>
          <button onclick="setPracticeMode('blitz')" class="cel-btn py-2.5 rounded-2xl text-xs font-black"
            style="background-color: ${practiceState.subMode === 'blitz' ? 'var(--accent-pink)' : 'var(--bg-card)'};
                   color: ${practiceState.subMode === 'blitz' ? '#ffffff' : 'var(--text-muted)'};">
            ⚡ QUICK BLITZ
          </button>
        </div>
      `;

      if (practiceState.subMode === 'srs') {
        const pool = getFilteredCards();
        let card = pool.find(c => c.id === practiceState.currentCardId);
        if (!card) {
          card = pickNextSRSCard();
          practiceState.currentCardId = card ? card.id : null;
          practiceState.flipped = false;
        }
        const srsInfo = card ? (appState.srs[card.id] || { level: 0 }) : { level: 0 };
        const masteryNames = ['NEW', 'LEARNING', 'FAMILIAR', 'MASTERED'];
        const mLabel = masteryNames[Math.min(3, srsInfo.level)];

        container.innerHTML = `
          <div class="space-y-3.5 animate-fade-up">
            ${switcher}

            <!-- Category Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              ${categories.map(cat => `
                <button onclick="setPracticeCategory('${escapeAttr(cat)}')" class="cel-btn shrink-0 px-3 py-1 rounded-xl text-[11px] font-extrabold"
                  style="background-color: ${practiceState.category === cat ? 'var(--accent-gold)' : 'var(--bg-card)'};
                         color: ${practiceState.category === cat ? '#181a2f' : 'var(--text-main)'};">
                  ${cat}
                </button>
              `).join('')}
            </div>

            <div class="flex justify-between text-[11px] font-extrabold px-1" style="color: var(--text-muted);">
              <span>DECK: ${pool.length} CARDS</span>
              <span style="color: var(--accent-green);">MASTERED: ${getMasteredCount()}</span>
            </div>

            ${card ? `
              <!-- 3D Hardware-Accelerated Flip Card -->
              <div class="perspective-1000 w-full h-72 cursor-pointer" onclick="flipCard()">
                <div class="preserve-3d relative w-full h-full ${practiceState.flipped ? 'rotate-y-180' : ''}">
                  <!-- FRONT -->
                  <div class="backface-hidden absolute inset-0 cel-card-accent p-5 flex flex-col justify-between speed-lines">
                    <div class="flex items-center justify-between">
                      <span class="anime-tag px-2 py-0.5 text-[10px] font-black" style="background-color: var(--bg-card-alt); color: var(--text-main);">
                        <span>${escapeHTML(card.cat)}</span>
                      </span>
                      <span class="text-[10px] font-black px-2 py-0.5 rounded-lg border-2"
                        style="background-color: ${srsInfo.level >= 2 ? 'var(--accent-green)' : 'var(--accent-gold)'}; color: #181a2f; border-color: #181a2f;">
                        ${mLabel}
                      </span>
                    </div>

                    <div class="text-center space-y-2 my-auto">
                      <div class="text-[10px] font-black uppercase tracking-widest" style="color: var(--text-muted);">Standard Finnish</div>
                      <div class="text-3xl font-black tracking-tight">${escapeHTML(card.fi)}</div>
                      ${appState.showSpoken && card.puhe ? `
                        <div class="inline-block px-3 py-1 rounded-xl border-2 text-xs font-extrabold"
                          style="background-color: var(--bg-card-alt); border-color: var(--accent-pink); color: var(--accent-pink);">
                          Spoken: ${escapeHTML(card.puhe)}
                        </div>
                      ` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t-2" style="border-color: var(--border-subtle);">
                      ${audioButtonsHTML(card.fi, false)}
                      <span class="text-[10px] font-black uppercase" style="color: var(--text-muted);">Tap to Flip ↻</span>
                    </div>
                  </div>

                  <!-- BACK -->
                  <div class="backface-hidden rotate-y-180 absolute inset-0 cel-card-accent p-5 flex flex-col justify-between"
                    style="background-color: var(--bg-card-alt);">
                    <div class="flex items-center justify-between">
                      <span class="anime-tag px-2 py-0.5 text-[10px] font-black" style="background-color: var(--accent-pink); color: #ffffff;">
                        <span>ENGLISH MEANING</span>
                      </span>
                      ${audioButtonsHTML(card.ex || card.fi, true)}
                    </div>

                    <div class="text-center space-y-3 my-auto">
                      <div class="text-2xl font-black">${escapeHTML(card.en)}</div>
                      ${card.ex ? `
                        <div class="cel-card p-3 text-left space-y-1">
                          <div class="text-xs font-black" style="color: var(--accent-primary);">${escapeHTML(card.ex)}</div>
                          <div class="text-[11px] font-medium" style="color: var(--text-muted);">${escapeHTML(card.exEn || '')}</div>
                        </div>
                      ` : ''}
                    </div>

                    <div class="text-center text-[10px] font-black uppercase" style="color: var(--text-muted);">Rate how well you remembered below</div>
                  </div>
                </div>
              </div>

              <!-- 3 Spaced-Repetition Self-Rating Buttons -->
              <div class="grid grid-cols-3 gap-2.5 pt-1">
                <button onclick="rateSRSCard(0)" class="cel-btn py-3 rounded-2xl flex flex-col items-center"
                  style="background-color: var(--accent-pink); color: #ffffff;">
                  <span class="text-xs font-black">AGAIN</span>
                  <span class="text-[10px] font-bold opacity-90">1 min • +2 XP</span>
                </button>
                <button onclick="rateSRSCard(1)" class="cel-btn py-3 rounded-2xl flex flex-col items-center"
                  style="background-color: var(--accent-primary); color: var(--accent-primary-text);">
                  <span class="text-xs font-black">GOOD</span>
                  <span class="text-[10px] font-bold opacity-90">1 day • +5 XP</span>
                </button>
                <button onclick="rateSRSCard(2)" class="cel-btn py-3 rounded-2xl flex flex-col items-center"
                  style="background-color: var(--accent-green); color: #181a2f;">
                  <span class="text-xs font-black">EASY</span>
                  <span class="text-[10px] font-bold opacity-90">4 days • +8 XP</span>
                </button>
              </div>
            ` : `<div class="cel-card p-6 text-center text-xs font-bold">No cards in this category yet.</div>`}
          </div>
        `;
      } else {
        // QUICK BLITZ MODE
        if (!blitzState.active && !blitzState.finished) {
          container.innerHTML = `
            <div class="space-y-4 animate-fade-up">
              ${switcher}
              <div class="cel-card-accent speed-lines p-5 text-center space-y-3.5">
                <div class="flex justify-center">${ainoSVG('cheering', 88)}</div>
                <div>
                  <div class="font-impact text-3xl tracking-wider" style="color: var(--accent-pink); text-shadow: 2px 2px 0 #181a2f;">
                    QUICK BLITZ CHALLENGE!
                  </div>
                  <p class="text-xs font-bold mt-1 leading-relaxed" style="color: var(--text-muted);">
                    10 timed Finnish questions! Chain correct answers for a <strong style="color:var(--accent-gold)">x5 COMBO</strong> and aim for an <strong style="color:var(--accent-primary)">S-RANK</strong>!
                  </p>
                </div>
                <div class="inline-block px-3 py-1 rounded-xl border-2 text-xs font-black"
                  style="background-color: var(--bg-card-alt); border-color: var(--border-subtle);">
                  BEST SCORE: <span style="color: var(--accent-gold);">${appState.bestBlitz} / 10</span>
                </div>
                <button onclick="startBlitz()" class="cel-btn w-full py-3.5 rounded-2xl font-impact text-2xl tracking-wider"
                  style="background-color: var(--accent-gold); color: #181a2f;">
                  START QUICK BLITZ ⚡
                </button>
              </div>
            </div>
          `;
        } else if (blitzState.finished) {
          const grade = blitzState.score >= 9 ? 'S' : blitzState.score >= 8 ? 'A' : blitzState.score >= 6 ? 'B' : 'C';
          const gradeColors = { S: '#ffd166', A: '#00e5ff', B: '#2ee6a6', C: '#ff4d8d' };
          const mult = Math.min(5, Math.max(1, blitzState.maxCombo));
          const earnedXp = blitzState.score * 6 + mult * 4;
          container.innerHTML = `
            <div class="space-y-4 animate-fade-up">
              ${switcher}
              <div class="cel-card-accent speed-lines p-5 text-center space-y-4">
                <div class="flex items-center justify-center gap-4">
                  ${ainoSVG(blitzState.score >= 7 ? 'cheering' : 'happy', 84)}
                  <div>
                    <div class="text-[10px] font-black uppercase" style="color: var(--text-muted);">FINAL RANK</div>
                    <div class="font-impact text-7xl leading-none" style="color: ${gradeColors[grade]}; text-shadow: 4px 4px 0 #181a2f;">
                      ${grade}
                    </div>
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <div class="cel-card p-2.5">
                    <div class="font-impact text-xl" style="color: var(--accent-primary);">${blitzState.score}/10</div>
                    <div class="text-[10px] font-bold" style="color: var(--text-muted);">SCORE</div>
                  </div>
                  <div class="cel-card p-2.5">
                    <div class="font-impact text-xl" style="color: var(--accent-pink);">x${mult}</div>
                    <div class="text-[10px] font-bold" style="color: var(--text-muted);">MAX COMBO</div>
                  </div>
                  <div class="cel-card p-2.5">
                    <div class="font-impact text-xl" style="color: var(--accent-gold);">+${earnedXp}</div>
                    <div class="text-[10px] font-bold" style="color: var(--text-muted);">XP EARNED</div>
                  </div>
                </div>
                <button onclick="startBlitz()" class="cel-btn w-full py-3 rounded-2xl font-impact text-xl tracking-wider"
                  style="background-color: var(--accent-primary); color: var(--accent-primary-text);">
                  PLAY AGAIN ⚡
                </button>
              </div>
            </div>
          `;
        } else {
          const q = blitzState.questions[blitzState.qIdx];
          const timeRatio = Math.max(0, blitzState.timeLeft / 12);
          const mult = Math.min(5, Math.max(1, blitzState.combo));
          const ainoMood = blitzState.answered ? (blitzState.chosenIdx === q.correct ? 'cheering' : 'surprised') : 'thinking';

          container.innerHTML = `
            <div class="space-y-3">
              ${switcher}

              <!-- Timer & Combo Row -->
              <div class="flex items-center justify-between text-xs font-black px-1">
                <span>Q ${blitzState.qIdx + 1}/10</span>
                <span class="anime-tag px-2 py-0.5" style="background-color: ${mult >= 2 ? 'var(--accent-gold)' : 'var(--bg-card-alt)'}; color: ${mult >= 2 ? '#181a2f' : 'var(--text-main)'};">
                  <span>COMBO x${mult}</span>
                </span>
                <span style="color: ${blitzState.timeLeft <= 4 ? 'var(--accent-pink)' : 'var(--accent-primary)'};">⏱ ${blitzState.timeLeft}s</span>
              </div>

              <!-- GPU scaleX Timer Bar -->
              <div class="rpg-gauge-track h-3">
                <div class="rpg-gauge-fill" style="transform: scaleX(${timeRatio}); background: ${blitzState.timeLeft <= 4 ? 'var(--accent-pink)' : 'var(--accent-primary)'};"></div>
              </div>

              <!-- Question Card with Aino -->
              <div class="vn-box p-3.5 flex items-center gap-3">
                ${ainoSVG(ainoMood, 60)}
                <div class="flex-1 min-w-0">
                  <div class="text-[10px] font-black uppercase" style="color: var(--accent-pink);">${q.tag}</div>
                  <div class="text-sm font-black mt-0.5 leading-snug">${escapeHTML(q.prompt)}</div>
                  ${q.speak ? `<div class="mt-2">${audioButtonsHTML(q.speak, true)}</div>` : ''}
                </div>
              </div>

              <!-- Answer Choices -->
              <div class="space-y-2">
                ${q.options.map((opt, idx) => {
                  let bg = 'var(--bg-card)', border = 'var(--border-subtle)', col = 'var(--text-main)';
                  if (blitzState.answered) {
                    if (idx === q.correct) { bg = 'var(--accent-green)'; border = '#181a2f'; col = '#181a2f'; }
                    else if (idx === blitzState.chosenIdx) { bg = 'var(--accent-pink)'; border = '#181a2f'; col = '#ffffff'; }
                  }
                  return `

      const prev = appState.srs[id] || { level: 0, reviews: 0, nextDue: 0 };
      const intervals = [60000, 86400000, 4 * 86400000];
      const xpRewards = [2, 5, 8];
      const nextLevel = rating === 0 ? 0 : Math.min(3, prev.level + (rating === 2 ? 2 : 1));

      appState.srs[id] = { level: nextLevel, reviews: prev.reviews + 1, nextDue: Date.now() + intervals[rating] };

    function buildBlitzQuestions() {
      const qs = [];
      const cards = [...BASE_FLASHCARDS].sort(() => Math.random() - 0.5);

      for (let i = 0; i < 4; i++) {
        const c = cards[i];
        const bad = cards.filter(x => x.id !== c.id).slice(0, 3).map(x => x.en);
        const options = [c.en, ...bad].sort(() => Math.random() - 0.5);
        qs.push({ tag: 'VOCABULARY', prompt: `What does "${c.fi}" mean?`, speak: c.fi, options, correct: options.indexOf(c.en), explain: `${c.fi} (spoken: ${c.puhe}) means "${c.en}".` });
      }

      const spokenPool = [
        { k: 'Minä olen', p: 'Mä oon', bad: ['Sä oot', 'Mä en tiiä', 'Me ollaan'] },
        { k: 'Minä en tiedä', p: 'Mä en tiiä', bad: ['Mä oon', 'Sä et puhu', 'Eipä kestä'] },
        { k: 'Mikä sinun nimesi on?', p: 'Mikä sun nimi on?', bad: ['Paljon tää maksaa?', 'Missä sä oot?', 'Kuka toi on?'] },
        { k: 'Paljonko tämä maksaa?', p: 'Paljon tää maksaa?', bad: ['Paljon kello on?', 'Mä maksan kortilla', 'Saisko laskun?'] }
      ].sort(() => Math.random() - 0.5);

      for (let i = 0; i < 3; i++) {
        const item = spokenPool[i];
        const options = [item.p, ...item.bad].sort(() => Math.random() - 0.5);
        qs.push({ tag: 'STANDARD → SPOKEN', prompt: `Spoken Finnish for "${item.k}"?`, speak: item.k, options, correct: options.indexOf(item.p), explain: `In everyday Spoken Finnish, "${item.k}" becomes "${item.p}".` });
      }

      const casePool = [
        { p: 'How do you say "in the forest" (metsä)?', a: 'metsässä', bad: ['metsässa', 'metsästä', 'metsään'], exp: 'metsä has front vowel ä → Inessive -ssä (metsässä).' },
        { p: 'How do you say "from Finland" (Suomi)?', a: 'Suomesta', bad: ['Suomessa', 'Suomeen', 'Suomea'], exp: 'Elative ("from") uses -sta → Suomesta.' },
        { p: 'How do you say "in the bank" (pankki)?', a: 'pankissa', bad: ['pankkissa', 'pankista', 'pankkiin'], exp: 'pankki softens kk → k before -ssa → pankissa.' },
        { p: 'How do you say "in the shop" (kauppa)?', a: 'kaupassa', bad: ['kauppassa', 'kaupasta', 'kauppaan'], exp: 'kauppa softens pp → p before -ssa → kaupassa.' }
      ].sort(() => Math.random() - 0.5);

      for (let i = 0; i < 3; i++) {
        const item = casePool[i];
        const options = [item.a, ...item.bad].sort(() => Math.random() - 0.5);
        qs.push({ tag: 'CASE BUILDER', prompt: item.p, speak: item.a, options, correct: options.indexOf(item.a), explain: item.exp });
      }

      return qs.sort(() => Math.random() - 0.5);
    }

    function extractJSONFromText(rawText) {
      const text = String(rawText || '').trim();
      try {
        return JSON.parse(text);
      } catch (e) {
        // Strip markdown code fences if a provider wrapped JSON in ```json ... ```
        const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenced && fenced[1]) {
          return JSON.parse(fenced[1].trim());
        }
        // Fallback: locate outermost JSON object or array
        const firstBrace = text.indexOf('{');
        const firstBracket = text.indexOf('[');
        let start = -1;
        let end = -1;
        if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
          start = firstBracket;
          end = text.lastIndexOf(']');
        } else if (firstBrace !== -1) {
          start = firstBrace;
          end = text.lastIndexOf('}');
        }
        if (start !== -1 && end > start) {
          return JSON.parse(text.slice(start, end + 1));
        }
        throw new Error('AI returned an unexpected format. Please try again.');
      }
    }

      const apiKey = (aiConfig.apiKey || '').trim();
      const model = (aiConfig.model || provInfo.defaultModel).trim();

      async function executeOnce() {
        // 1. GOOGLE GEMINI (also supports empty key in Preview runtime)

          const targetModel = apiKey ? model : 'gemini-3-flash-preview';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(targetModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: 'application/json', responseSchema }
          };
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            let detail = '';

            const err = new Error(formatAIError(res.status, detail, provInfo.name));
            err.status = res.status;
            throw err;
          }
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error('Empty response from Google Gemini.');
          return extractJSONFromText(text);

              max_tokens: 1024,
              system: systemPrompt + schemaInstruction,
              messages: [{ role: 'user', content: userPrompt }]
            })
          });
          if (!res.ok) {
            let detail = '';
            try { const errJson = await res.json(); detail = errJson?.error?.message || ''; } catch (e) {}
            const err = new Error(formatAIError(res.status, detail, provInfo.name));
            err.status = res.status;
            throw err;
          }
          const data = await res.json();
          const text = data?.content?.[0]?.text;
          if (!text) throw new Error('Empty response from Anthropic Claude.');
          return extractJSONFromText(text);
        }

        // 3. OPENAI / GROQ / OPENROUTER / CUSTOM OPENAI-COMPATIBLE
        let endpoint = 'https://api.openai.com/v1/chat/completions';
        const headers = { 'Content-Type': 'application/json' };

        if (provider === 'openai') {
          if (!apiKey) throw new Error('Please enter your OpenAI API key in Profile → AI Engine.');
          endpoint = 'https://api.openai.com/v1/chat/completions';
          headers['Authorization'] = `Bearer ${apiKey}`;
        } else if (provider === 'groq') {
          if (!apiKey) throw new Error('Please enter your Groq API key in Profile → AI Engine.');
          endpoint = 'https://api.groq.com/openai/v1/chat/completions';
          headers['Authorization'] = `Bearer ${apiKey}`;
        } else if (provider === 'openrouter') {
          if (!apiKey) throw new Error('Please enter your OpenRouter API key in Profile → AI Engine.');
          endpoint = 'https://openrouter.ai/api/v1/chat/completions';
          headers['Authorization'] = `Bearer ${apiKey}`;
          headers['HTTP-Referer'] = window.location.origin || 'https://finnish-academy.local';
          headers['X-Title'] = 'Finnish Academy';
        } else if (provider === 'custom') {
          endpoint = (aiConfig.customBaseUrl || '').trim();
          if (!endpoint) throw new Error('Please enter a Custom Endpoint URL in Profile → AI Engine.');
          if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;
        }

        const bodyObj = {
          model,
          messages: [
            { role: 'system', content: systemPrompt + schemaInstruction },
            { role: 'user', content: userPrompt }
          ],
          temperature: 0.7
        };
        if (responseSchema && responseSchema.type === 'OBJECT' && provider !== 'custom') {
          bodyObj.response_format = { type: 'json_object' };
        }

        const res = await fetch(endpoint, {
          method: 'POST',
          headers,
          body: JSON.stringify(bodyObj)
        });
        if (!res.ok) {
          let detail = '';
          try { const errJson = await res.json(); detail = errJson?.error?.message || errJson?.message || ''; } catch (e) {}
          const err = new Error(formatAIError(res.status, detail, provInfo.name));
          err.status = res.status;
          throw err;
        }
        const data = await res.json();
        const text = data?.choices?.[0]?.message?.content;
        if (!text) throw new Error(`Empty response from ${provInfo.name}.`);
        return extractJSONFromText(text);
      }

      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          return await executeOnce();
        } catch (err) {
          const retryable = err && (err.status === 429 || (err.status >= 500 && err.status < 600));
          if (retryable && attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
            continue;
          }
          throw err;
        }
      }
    }

          properties: {

            spoken: { type: 'STRING' },
            english: { type: 'STRING' },

    /* ------------------------------------------------------------------------
       BACKUP & RESTORE ENGINE (JSON FILE + SAVE CODE FALLBACK)
       ------------------------------------------------------------------------ */
    function formatBackupTimestamp(iso) {
      if (!iso) return 'Not backed up yet';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return 'Not backed up yet';
        return d.toLocaleString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      } catch (e) {
        return 'Not backed up yet';
      }
    }

    function buildBackupPayload() {
      const nowIso = new Date().toISOString();
      return {
        app: 'finnish-academy',
        schemaVersion: 1,
        exportedAt: nowIso,
        data: {
          ...appState,
          lastBackupAt: nowIso
        }
      };
    }

    function encodeSaveCode(payloadObj) {
      const jsonStr = JSON.stringify(payloadObj);
      const utf8Bytes = encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (_, p1) =>
        String.fromCharCode(parseInt(p1, 16))
      );
      return 'FA1:' + btoa(utf8Bytes);
    }

    function decodeSaveCodeOrJSON(rawText) {
      const trimmed = String(rawText || '').trim();
      if (!trimmed) throw new Error('Backup input is empty.');
      if (trimmed.startsWith('FA1:')) {
        const b64 = trimmed.slice(4).replace(/\s+/g, '');
        const binary = atob(b64);
        const percentEncoded = Array.from(binary, ch =>
          '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2)
        ).join('');
        return JSON.parse(decodeURIComponent(percentEncoded));
      }
      return JSON.parse(trimmed);
    }

    function validateBackupObject(parsed) {
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Backup file is not a valid JSON object.');
      }
      // Support both wrapped schema ({ app, schemaVersion, data }) and direct state objects
      let data = parsed;
      if (parsed.data && typeof parsed.data === 'object' && !Array.isArray(parsed.data)) {
        if (parsed.app && parsed.app !== 'finnish-academy') {
          throw new Error('This backup file belongs to a different app.');
        }
        data = parsed.data;
      }

      const hasValidXp = typeof data.xp === 'number' && Number.isFinite(data.xp) && data.xp >= 0;
      const hasLessons = Array.isArray(data.completedLessons);
      const hasBadges = Array.isArray(data.badges);
      const hasSrs = data.srs && typeof data.srs === 'object' && !Array.isArray(data.srs);
      const hasCustom = Array.isArray(data.customCards);

      if (!hasValidXp || !hasLessons || !hasBadges || !hasSrs || !hasCustom) {
        throw new Error('Backup is missing required Finnish Academy progress fields.');
      }

      const defaults = getDefaultState();
      return {
        theme: data.theme === 'light' ? 'light' : 'dark',
        showSpoken: typeof data.showSpoken === 'boolean' ? data.showSpoken : defaults.showSpoken,
        sfxEnabled: typeof data.sfxEnabled === 'boolean' ? data.sfxEnabled : defaults.sfxEnabled,
        reducedMotion: typeof data.reducedMotion === 'boolean' ? data.reducedMotion : defaults.reducedMotion,
        showFps: typeof data.showFps === 'boolean' ? data.showFps : defaults.showFps,
        xp: Math.max(0, Math.floor(data.xp)),
        dailyXp: typeof data.dailyXp === 'number' && Number.isFinite(data.dailyXp) ? Math.max(0, Math.floor(data.dailyXp)) : 0,
        dailyGoal: typeof data.dailyGoal === 'number' && data.dailyGoal >= 30 && data.dailyGoal <= 250 ? Math.floor(data.dailyGoal) : defaults.dailyGoal,
        streak: typeof data.streak === 'number' && Number.isFinite(data.streak) ? Math.max(1, Math.floor(data.streak)) : 1,
        lastActiveDate: typeof data.lastActiveDate === 'string' && data.lastActiveDate.length >= 8 ? data.lastActiveDate : getTodayStr(),
        lastBackupAt: typeof parsed.exportedAt === 'string' ? parsed.exportedAt : (typeof data.lastBackupAt === 'string' ? data.lastBackupAt : new Date().toISOString()),
        completedLessons: data.completedLessons.filter(id => typeof id === 'string'),
        badges: data.badges.filter(id => typeof id === 'string'),
        srs: data.srs,
        customCards: data.customCards.filter(c => c && typeof c === 'object' && typeof c.fi === 'string' && typeof c.en === 'string'),
        casesExplored: Array.isArray(data.casesExplored) ? data.casesExplored.filter(x => typeof x === 'string') : [],
        bestBlitz: typeof data.bestBlitz === 'number' && Number.isFinite(data.bestBlitz) ? Math.max(0, Math.min(10, Math.floor(data.bestBlitz))) : 0
      };
    }

    function applyRestoredState(validatedState) {
      appState = validatedState;
      applyPreferences();
      saveState();
      sfx.play('levelup');
      spawnImpactCallout('RESTORED!', '#2ee6a6');
      renderCurrentTab();
      const lessonsCount = appState.completedLessons.length;
      const customCount = appState.customCards.length;
      showToast(
        `Progress restored! ${appState.xp} XP, ${lessonsCount} lesson${lessonsCount === 1 ? '' : 's'}, ${customCount} custom card${customCount === 1 ? '' : 's'}.`,
        'xp'
      );
    }

    function exportBackupFile() {
      try {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const filename = `finnish-academy-backup-${getTodayStr()}.json`;

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);

        appState.lastBackupAt = payload.exportedAt;
        saveState();
        sfx.play('export');
        showToast(`Backup downloaded: ${filename}`, 'xp');
        renderCurrentTab();
      } catch (err) {
        sfx.play('wrong');
        showToast('File download blocked here — opening Save Code instead.', 'info');
        openCopyCodeModal(encodeSaveCode(buildBackupPayload()));
      }
    }

    function triggerImportFile() {
      sfx.play('click');
      const input = document.getElementById('backup-file-input');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function handleImportFile(event) {
      const file = event.target && event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = decodeSaveCodeOrJSON(e.target.result);
          const validated = validateBackupObject(parsed);
          applyRestoredState(validated);
        } catch (err) {
          sfx.play('wrong');
          showToast(`Import failed: ${err.message || 'Invalid backup file.'} Existing progress kept safe.`, 'error');
        }
      };
      reader.onerror = () => {
        sfx.play('wrong');
        showToast('Could not read the selected file. Existing progress kept safe.', 'error');
      };
      reader.readAsText(file);
    }

    function copySaveCode() {
      try {
        const payload = buildBackupPayload();
        const code = encodeSaveCode(payload);

        // Use execCommand('copy') for reliable clipboard support inside iFrames and Android WebViews
        const ta = document.createElement('textarea');
        ta.value = code;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, code.length);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (e) {
          copied = false;
        }
        document.body.removeChild(ta);

        appState.lastBackupAt = payload.exportedAt;
        saveState();
        renderCurrentTab();

        if (copied) {
          sfx.play('export');
          showToast('Save Code copied to clipboard! Keep it somewhere safe.', 'xp');
        } else {
          openCopyCodeModal(code);
        }
      } catch (err) {
        sfx.play('wrong');
        showToast('Could not generate Save Code.', 'error');
      }
    }
