          <textarea id="restore-code-input" rows="5" placeholder="Paste your Save Code (FA1:...) or JSON backup here..."
            class="w-full p-3 rounded-xl border-2 text-[11px] font-mono focus:outline-none"
            style="background-color: var(--bg-card-alt); border-color: var(--border-ink); color: var(--text-main);"></textarea>
          <div id="restore-code-error" class="hidden p-2.5 rounded-xl border-2 text-xs font-bold"
            style="background-color: rgba(255, 59, 92, 0.16); border-color: #ff3b5c; color: #ff6b81;"></div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="closeModal()" class="cel-btn py-2.5 rounded-xl text-xs font-black"
              style="background-color: var(--bg-card-alt); color: var(--text-main);">CANCEL</button>
            <button onclick="executeRestoreFromCode()" class="cel-btn py-2.5 rounded-xl text-xs font-black"
              style="background-color: var(--accent-green); color: #181a2f;">VALIDATE &amp; RESTORE</button>
          </div>
        </div>
      `);
    }

    function executeRestoreFromCode() {
      const ta = document.getElementById('restore-code-input');
      const errBox = document.getElementById('restore-code-error');
      const raw = ta ? ta.value : '';
      try {
        const parsed = decodeSaveCodeOrJSON(raw);
        const validated = validateBackupObject(parsed);
        closeModal();
        applyRestoredState(validated);
      } catch (err) {
        sfx.play('wrong');
        if (errBox) {
          errBox.textContent = `Invalid backup code: ${err.message || 'Please check the code and try again.'} Your existing progress was not changed.`;
          errBox.classList.remove('hidden');
        }
      }
    }

    function confirmReset(step = 1) {
      sfx.play('click');
      if (step === 1) {
        openModal(`
          <div class="p-6 text-center space-y-4">
            <div class="flex justify-center">${ainoSVG('surprised', 84)}</div>
            <div>
              <div class="text-[10px] font-black uppercase tracking-wider" style="color: var(--accent-gold);">STEP 1 OF 2</div>
              <div class="font-impact text-3xl mt-0.5" style="color: var(--accent-pink);">RESET ALL PROGRESS?</div>
              <p class="text-xs font-bold mt-1" style="color: var(--text-muted);">
                This will erase your Level, XP, completed lessons, badges, and saved flashcards. Consider exporting a backup first!
              </p>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="closeModal()" class="cel-btn py-2.5 rounded-xl text-xs font-black"
                style="background-color: var(--bg-card-alt); color: var(--text-main);">CANCEL</button>
              <button onclick="confirmReset(2)" class="cel-btn py-2.5 rounded-xl text-xs font-black"
                style="background-color: var(--accent-gold); color: #181a2f;">CONTINUE →</button>
            </div>
          </div>
        `);
      } else {
        openModal(`
          <div class="p-6 text-center space-y-4">
            <div class="flex justify-center">${ainoSVG('surprised', 84)}</div>
            <div>
              <div class="text-[10px] font-black uppercase tracking-wider" style="color: var(--accent-pink);">STEP 2 OF 2 • FINAL WARNING</div>
              <div class="font-impact text-3xl mt-0.5" style="color: var(--accent-pink);">ARE YOU 100% SURE?</div>
              <p class="text-xs font-bold mt-1" style="color: var(--text-muted);">
                Your <strong>${appState.xp} XP</strong>, <strong>${appState.completedLessons.length} completed lessons</strong>, and <strong>${appState.customCards.length} custom cards</strong> will be permanently deleted.
              </p>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="closeModal()" class="cel-btn py-2.5 rounded-xl text-xs font-black"
                style="background-color: var(--bg-card-alt); color: var(--text-main);">KEEP MY DATA</button>
              <button onclick="executeReset()" class="cel-btn py-2.5 rounded-xl text-xs font-black"
                style="background-color: var(--accent-pink); color: #ffffff;">YES, ERASE ALL</button>
            </div>
          </div>
        `);
      }
    }

    function executeReset() {
      localStorage.removeItem(STORAGE_KEY);
      appState = getDefaultState();
      applyPreferences();
      saveState();
      closeModal();
      showToast('All progress has been reset.', 'info');
      renderCurrentTab();
    }

    /* ========================================================================
       15. BOOTSTRAP ON LOAD
       ======================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      applyPreferences();
      syncHUD();
      engine120Hz.init();
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === 'learn');
      });
      renderCurrentTab();
    });
  </script>
</body>
</html>
